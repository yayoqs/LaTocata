<!DOCTYPE html>
<html lang="es-CL" data-tema="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaTocata — Prototipo 3 · Sidebar acordeón</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,600;0,700;1,500;1,600&family=Figtree:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   BASE Y RESET
   ================================================================ */
:root { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Figtree', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100dvh;
  font-size: 15px;
  line-height: 1.4;
  transition: background 0.25s ease, color 0.25s ease;
}
h1, h2, h3, h4 { font-weight: 700; line-height: 1.1; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font: inherit; color: inherit; }
a { color: var(--a1); text-decoration: none; }
ul, ol { list-style: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--ch); border-radius: 4px; }

/* ================================================================
   TEMAS — 5 personalidades
   ================================================================ */
body[data-tema="a"] {
  --bg:#f1e7d0; --pa:#fbf4e2; --ink:#1d1a16;
  --a1:#d6402a; --a2:#2a4d9b; --on1:#fff; --on2:#fff;
  --ch:#e3d5b4; --fd:'Anton',Impact,sans-serif;
  --r:4px; --bw:2px; --sh:4px 4px 0 var(--ink);
  --tt:uppercase; --ti:normal;
}
body[data-tema="c"] {
  --bg:#f0e0b4; --pa:#fff6dc; --ink:#2b1a0d;
  --a1:#c0392b; --a2:#1f6b4a; --on1:#fff6dc; --on2:#fff6dc;
  --ch:#e6cf93; --fd:'Fraunces',serif;
  --r:16px; --bw:3px; --sh:0 4px 0 var(--ink);
  --tt:none; --ti:italic;
}
body[data-tema="b"] {
  --bg:#0c0a14; --pa:#171227; --ink:#f1ecff;
  --a1:#ff4fa3; --a2:#7b4dff; --on1:#fff; --on2:#fff;
  --ch:#2a2147; --fd:'Space Grotesk',sans-serif;
  --r:18px; --bw:1px; --sh:0 0 18px rgba(255,79,163,.4);
  --tt:none; --ti:normal;
}
body[data-tema="d"] {
  --bg:#cdb48a; --pa:#e6d4ae; --ink:#231b12;
  --a1:#1f4d3a; --a2:#f2b705; --on1:#f2e8d0; --on2:#231b12;
  --ch:#bfa271; --fd:'Anton',Impact,sans-serif;
  --r:2px; --bw:2px; --sh:3px 3px 0 var(--ink);
  --tt:uppercase; --ti:normal;
}
body[data-tema="e"] {
  --bg:#ffe3ec; --pa:#fff; --ink:#2a1f4d;
  --a1:#ff5c8a; --a2:#19b5a5; --on1:#fff; --on2:#fff;
  --ch:#ffd0de; --fd:'Fraunces',serif;
  --r:22px; --bw:2px; --sh:4px 4px 0 #2a1f4d;
  --tt:none; --ti:normal;
}

/* ================================================================
   SHELL
   ================================================================ */
.shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: 100dvh;
  transition: grid-template-columns 0.28s ease;
}
.shell.replegado { grid-template-columns: 72px 1fr; }

/* ---------- Sidebar ---------- */
.shell__lateral {
  background: var(--pa);
  border-right: var(--bw) solid var(--ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.shell__marca {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 20px;
  border-bottom: var(--bw) solid var(--ink);
  min-height: 64px;
  flex-shrink: 0;
}
.shell__marca-logo {
  width: 34px; height: 34px;
  border-radius: var(--r);
  background: var(--a1);
  color: var(--on1);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fd);
  font-weight: 700;
  font-size: 0.95rem;
  border: var(--bw) solid var(--ink);
  text-transform: var(--tt);
  font-style: var(--ti);
  flex-shrink: 0;
}
.shell__marca-texto {
  font-family: var(--fd);
  font-size: 1.1rem;
  text-transform: var(--tt);
  font-style: var(--ti);
  color: var(--a1);
  white-space: nowrap;
  transition: opacity 0.2s;
}
.shell.replegado .shell__marca-texto { opacity: 0; width: 0; overflow: hidden; }

.shell__lateral-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

/* ---------- Acordeón ---------- */
.shell__grupo {
  margin-bottom: 4px;
  border-radius: var(--r);
  overflow: hidden;
}

.shell__grupo-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 12px;
  color: var(--ink);
  font-size: 0.9rem;
  font-weight: 700;
  border-radius: var(--r);
  transition: background 0.15s;
  text-align: left;
}
.shell__grupo-btn:hover { background: var(--ch); }
.shell__grupo-btn.expandido {
  background: var(--a1);
  color: var(--on1);
}

.shell__grupo-icono {
  width: 22px; height: 22px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
}
.shell__grupo-label {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.2s;
}
.shell.replegado .shell__grupo-label,
.shell.replegado .shell__grupo-count,
.shell.replegado .shell__grupo-flecha { opacity: 0; width: 0; }

.shell__grupo-count {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 7px;
  background: var(--ch);
  color: var(--ink);
  border-radius: 99px;
  min-width: 20px;
  text-align: center;
  transition: all 0.2s;
}
.shell__grupo-btn.expandido .shell__grupo-count {
  background: rgba(255,255,255,0.25);
  color: var(--on1);
}

.shell__grupo-flecha {
  font-size: 0.7rem;
  transition: transform 0.25s ease;
  flex-shrink: 0;
}
.shell__grupo-btn.expandido .shell__grupo-flecha {
  transform: rotate(90deg);
}

/* ---------- Sub-vistas (acordeón) ---------- */
.shell__grupo-vistas {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.25s ease;
}
.shell__grupo.expandido .shell__grupo-vistas {
  grid-template-rows: 1fr;
}
.shell__grupo-vistas-inner {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding-left: 12px;
}

.shell__item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  color: var(--ink);
  font-size: 0.84rem;
  font-weight: 600;
  border-left: 2px solid var(--ch);
  border-radius: 0 var(--r) var(--r) 0;
  transition: all 0.15s;
  white-space: nowrap;
  cursor: pointer;
  width: 100%;
  text-align: left;
  opacity: 0.85;
}
.shell__item:hover {
  background: var(--ch);
  opacity: 1;
}
.shell__item.activo {
  background: var(--ch);
  border-left-color: var(--a1);
  color: var(--a1);
  opacity: 1;
  font-weight: 700;
}
.shell__item-icono {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
}

/* Replegado: los grupos se muestran como iconos sin acordeón */
.shell.replegado .shell__grupo-vistas {
  grid-template-rows: 0fr !important;
}
.shell.replegado .shell__grupo-count,
.shell.replegado .shell__grupo-flecha { display: none; }

.shell__lateral-pie {
  border-top: var(--bw) solid var(--ink);
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  font-size: 0.78rem;
}
.shell__usuario-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--a2);
  color: var(--on2);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 0.75rem;
  flex-shrink: 0;
  border: var(--bw) solid var(--ink);
}
.shell__usuario-info { transition: opacity 0.2s; min-width: 0; }
.shell__usuario-nombre { font-weight: 700; white-space: nowrap; }
.shell__usuario-rol {
  opacity: 0.6;
  font-size: 0.7rem;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.shell.replegado .shell__usuario-info { opacity: 0; width: 0; overflow: hidden; }

.shell__btn-replegar {
  position: absolute;
  top: 16px;
  right: -18px;
  width: 36px; height: 36px;
  border-radius: var(--r);
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30;
  box-shadow: var(--sh);
}

/* ---------- Columna principal ---------- */
.shell__principal {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
  overflow: hidden;
}

/* ---------- Topbar ---------- */
.shell__topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: var(--bw) solid var(--ink);
  background: var(--pa);
  min-height: 64px;
  flex-shrink: 0;
}
.shell__btn-hamburguesa {
  display: none;
  width: 40px; height: 40px;
  border-radius: var(--r);
  border: var(--bw) solid var(--ink);
  background: var(--pa);
  color: var(--ink);
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.shell__topbar-titulo-zona { flex: 1; min-width: 0; }
.shell__eyebrow {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  color: var(--a1);
  opacity: 0.85;
}
.shell__titulo {
  font-family: var(--fd);
  font-size: 1.25rem;
  font-weight: 700;
  text-transform: var(--tt);
  font-style: var(--ti);
  color: var(--a1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.05;
}

.shell__controles {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.shell__selector-rol {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--bg);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
}
.shell__rol {
  padding: 5px 10px;
  border-radius: calc(var(--r) - 2px);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--ink);
  opacity: 0.65;
  transition: all 0.15s;
  white-space: nowrap;
}
.shell__rol:hover { opacity: 1; }
.shell__rol.activo {
  background: var(--a1);
  color: var(--on1);
  opacity: 1;
}

.shell__selector-tema { display: flex; gap: 4px; }
.shell__tema-btn {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  transition: transform 0.15s;
}
.shell__tema-btn:hover { transform: scale(1.1); }
.shell__tema-btn.activo { outline: 2px solid var(--a1); outline-offset: 2px; }
.shell__tema-btn[data-tema-btn="a"] { background: linear-gradient(135deg, #d6402a 50%, #f1e7d0 50%); }
.shell__tema-btn[data-tema-btn="c"] { background: linear-gradient(135deg, #c0392b 50%, #f0e0b4 50%); }
.shell__tema-btn[data-tema-btn="b"] { background: linear-gradient(135deg, #ff4fa3 50%, #0c0a14 50%); }
.shell__tema-btn[data-tema-btn="d"] { background: linear-gradient(135deg, #1f4d3a 50%, #cdb48a 50%); }
.shell__tema-btn[data-tema-btn="e"] { background: linear-gradient(135deg, #ff5c8a 50%, #ffe3ec 50%); }

/* ---------- Chips ---------- */
.shell__chips {
  display: flex;
  gap: 6px;
  padding: 10px 20px;
  background: var(--bg);
  border-bottom: var(--bw) solid var(--ink);
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}
.shell__chips::-webkit-scrollbar { display: none; }
.shell__chip {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink);
  background: var(--pa);
  border: var(--bw) solid transparent;
  white-space: nowrap;
  transition: all 0.15s;
}
.shell__chip:hover { border-color: var(--ink); }
.shell__chip.activo {
  background: var(--a1);
  color: var(--on1);
  border-color: var(--ink);
}

/* ---------- Contenido ---------- */
.shell__contenido {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  padding-bottom: 100px;
}

/* ---------- Tabbar (móvil) ---------- */
.shell__tabbar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--pa);
  border-top: var(--bw) solid var(--ink);
  padding: 6px 8px;
  justify-content: space-around;
  z-index: 20;
  padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
}
.shell__tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 10px;
  border-radius: var(--r);
  color: var(--ink);
  opacity: 0.65;
  font-size: 0.62rem;
  font-weight: 700;
  transition: opacity 0.15s;
  min-width: 52px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.shell__tab.activo { opacity: 1; color: var(--a1); }
.shell__tab-icono { font-size: 1.25rem; }

/* ---------- Overlay móvil ---------- */
.shell__overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 35;
}
.shell__overlay.activo { display: block; }

/* ================================================================
   COMPONENTES
   ================================================================ */
.hero {
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  padding: 24px;
  box-shadow: var(--sh);
  position: relative;
  overflow: hidden;
}
.hero__badges { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.hero__titulo {
  font-family: var(--fd);
  font-size: clamp(2rem, 6vw, 3.2rem);
  text-transform: var(--tt);
  font-style: var(--ti);
  color: var(--a1);
  line-height: 0.95;
  margin: 8px 0 10px;
  letter-spacing: -0.01em;
}
.hero__desc { font-size: 0.98rem; margin-bottom: 16px; max-width: 640px; line-height: 1.5; }
.hero__meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.88rem; font-weight: 500; }

.sub { opacity: 0.68; font-size: 0.85rem; margin-bottom: 14px; line-height: 1.5; }
h3 {
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--a1);
  margin: 20px 0 8px;
  font-weight: 700;
}
h3:first-child { margin-top: 0; }

.g { display: grid; gap: 10px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

.card {
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: var(--sh);
}
.card__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.card__titulo {
  font-family: var(--fd);
  font-size: 1.05rem;
  text-transform: var(--tt);
  font-style: var(--ti);
  color: var(--ink);
}

.k { font: 2rem/1 var(--fd); color: var(--a1); }
.l {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  opacity: 0.65;
  font-weight: 700;
  margin-top: 2px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--a1);
  color: var(--on1);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  font-size: 0.85rem;
  font-weight: 700;
  box-shadow: var(--sh);
  transition: transform 0.1s, box-shadow 0.1s;
  white-space: nowrap;
}
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn--secundario { background: var(--pa); color: var(--ink); box-shadow: none; }
.btn--fantasma { background: transparent; color: var(--ink); border-color: transparent; box-shadow: none; }
.btn--fantasma:hover { border-color: var(--ink); }
.btn--peligro { background: var(--pa); color: var(--a1); border-color: var(--a1); box-shadow: none; }
.btn--chico { padding: 5px 10px; font-size: 0.76rem; }
.btn--grande { padding: 12px 22px; font-size: 0.95rem; }

.pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--ch);
  color: var(--ink);
  font-size: 0.7rem;
  font-weight: 700;
  border: var(--bw) solid var(--ink);
  margin: 2px 2px 0 0;
}
.pill--ok { background: var(--a2); color: var(--on2); }
.pill--hot { background: var(--a1); color: var(--on1); }
.pill--vivo::before {
  content: '●';
  margin-right: 4px;
  animation: pulso 1.4s ease infinite;
}
@keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  margin-bottom: 8px;
  box-shadow: var(--sh);
}
.row:last-child { margin-bottom: 0; }
.row__num {
  font-family: var(--fd);
  font-size: 1.2rem;
  width: 32px;
  text-align: center;
  color: var(--a1);
  flex-shrink: 0;
}
.row__info { flex: 1; min-width: 0; }
.row__titulo { font-weight: 700; font-size: 0.95rem; }
.row__meta { font-size: 0.76rem; opacity: 0.7; margin-top: 1px; }
.row--vivo { background: var(--a2); color: var(--on2); border-color: var(--ink); }
.row--vivo .row__num { color: var(--on2); }
.row--terminado { opacity: 0.5; }
.row--saltado { opacity: 0.4; text-decoration: line-through; }

.crono {
  font-family: var(--fd);
  font-size: clamp(3rem, 16vw, 6rem);
  color: var(--a1);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.barra {
  height: 10px;
  border: var(--bw) solid var(--ink);
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0;
  background: var(--pa);
}
.barra b {
  display: block;
  height: 100%;
  background: var(--a2);
  transition: width 0.3s;
}
.barra b.alerta { background: var(--a1); }

.chk {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px dashed var(--ch);
  cursor: pointer;
}
.chk:last-child { border-bottom: none; }
.chk i {
  width: 22px; height: 22px;
  border: var(--bw) solid var(--ink);
  border-radius: calc(var(--r) / 2);
  display: grid;
  place-items: center;
  font-style: normal;
  font-size: 0.8rem;
  flex-shrink: 0;
}
.chk.d i { background: var(--a2); color: var(--on2); }
.chk.d span { text-decoration: line-through; opacity: 0.55; }

input[type="text"], input[type="email"], input[type="number"], textarea, select {
  font: inherit;
  color: var(--ink);
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  padding: 8px 12px;
  min-width: 0;
  width: 100%;
}
input:focus, textarea:focus { outline: 2px solid var(--a1); outline-offset: -2px; }

.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--a1);
  color: var(--on1);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 0.95rem;
  flex-shrink: 0;
  border: var(--bw) solid var(--ink);
}
.avatar--chico { width: 28px; height: 28px; font-size: 0.72rem; }

.qa {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  box-shadow: var(--sh);
  text-align: left;
  width: 100%;
  transition: transform 0.1s;
}
.qa:active { transform: translate(2px, 2px); box-shadow: none; }
.qa__icono {
  width: 36px; height: 36px;
  border-radius: var(--r);
  background: var(--ch);
  display: grid;
  place-items: center;

function grupoDeVista(idVista) {
  return VISTAS[idVista] ? VISTAS[idVista].grupo : null;
}

  const rol = ROLES[ESTADO.rolActivo];
  return rol.grupos.map(idGrupo => {
    const restringidas = rol.vistasRestringidas[idGrupo];
    const vistas = restringidas
      ? GRUPOS[idGrupo].vistas.filter(v => restringidas.includes(v))
      : GRUPOS[idGrupo].vistas;
    return { grupo: idGrupo, vistas };
  }).filter(g => g.vistas.length > 0);
}

function vistasDelGrupo(idGrupo) {
  const rol = ROLES[ESTADO.rolActivo];
  const restringidas = rol.vistasRestringidas[idGrupo];
  const vistas = GRUPOS[idGrupo].vistas;
  return restringidas ? vistas.filter(v => restringidas.includes(v)) : vistas;

      </div>
    ` : ''}

    ${ESTADO.acts.map((a, i) => filaActo(a, i, true)).join('')}
  `;
};

function filaActo(a, i, conControles) {
  const claseEstado = a.estado === 'en_curso' ? 'row--vivo'
    : a.estado === 'terminado' ? 'row--terminado'
    : a.estado === 'saltado' ? 'row--saltado' : '';

  let pildora = '';
  if (a.estado === 'en_curso') pildora = '<span class="pill pill--ok pill--vivo">En vivo</span>';
  else if (a.estado === 'aprobado') pildora = '<span class="pill pill--hot">Aprobado</span>';
  else if (a.estado === 'anotado') pildora = '<span class="pill">Anotado</span>';
  else if (a.estado === 'terminado') pildora = '<span class="pill">Terminado</span>';
  else if (a.estado === 'saltado') pildora = '<span class="pill">Saltado</span>';

  let controles = '';
  if (conControles) {
    controles += `<button class="btn btn--fantasma btn--chico" data-mover="${i}:-1">▲</button>
                  <button class="btn btn--fantasma btn--chico" data-mover="${i}:1">▼</button>`;
    if (a.estado === 'anotado') controles += `<button class="btn btn--chico" data-acto="${i}:aprobar">Aprobar</button>`;
    if (a.estado === 'aprobado') controles += `<button class="btn btn--chico" data-acto="${i}:iniciar">▶</button><button class="btn btn--secundario btn--chico" data-acto="${i}:saltar">Saltar</button>`;
    if (a.estado === 'en_curso') controles += `<button class="btn btn--chico" data-acto="${i}:terminar">✓ Fin</button>`;
  }

  const hastaBadge = a.hastaQueLoBajen ? '<span class="pill pill--hot" style="margin-top:6px">Hasta que lo bajen</span>' : '';

  return `
    <div class="row ${claseEstado}">
      <div class="row__num">${a.orden}</div>
      <div class="row__info">
        <div class="row__titulo">${a.nombre}</div>
        <div class="row__meta">${a.tipo} · ${a.genero} · ${a.instrumentos.join(', ')} · ~${a.min} min</div>
        ${hastaBadge}
      </div>
      ${pildora}
      ${controles ? `<div style="display:flex;gap:4px;flex-wrap:wrap;">${controles}</div>` : ''}
    </div>
  `;
}

function renderContenido() {
  const cont = document.getElementById('contenido');
  const fn = RENDER[ESTADO.vistaActiva];
  cont.innerHTML = fn ? fn() : '<div class="card">Vista no implementada.</div>';
}

function renderTodo() {
  document.body.setAttribute('data-tema', ESTADO.temaActivo);
  renderSidebar();
  renderTopbar();
  renderChips();
  renderContenido();
  renderTabbar();
}

/* ================================================================
   NAVEGACIÓN
   ================================================================ */
function navegar(idVista) {
  if (!VISTAS[idVista]) return;
  const grupo = VISTAS[idVista].grupo;
  ESTADO.vistaActiva = idVista;
  ESTADO.grupoExpandido = grupo;
  ESTADO.ultimaVistaPorGrupo[grupo] = idVista;
  renderTodo();
  document.getElementById('lateral').classList.remove('abierto');
  document.getElementById('overlay').classList.remove('activo');
}

function togglearGrupo(idGrupo) {
  if (!GRUPOS[idGrupo]) return;
  // Acordeón: solo un grupo expandido a la vez
  if (ESTADO.grupoExpandido === idGrupo) {
    ESTADO.grupoExpandido = null;
  } else {
    ESTADO.grupoExpandido = idGrupo;
  }
  renderSidebar();
}

function irATabDeGrupo(idGrupo) {
  // En móvil: navega a la última vista visitada del grupo, o a la primera
  const rol = ROLES[ESTADO.rolActivo];
  const restringidas = rol.vistasRestringidas[idGrupo];
  const vistas = GRUPOS[idGrupo].vistas;
  const validas = restringidas ? vistas.filter(v => restringidas.includes(v)) : vistas;
  if (validas.length === 0) return;
  const ultima = ESTADO.ultimaVistaPorGrupo[idGrupo];
  const destino = ultima && validas.includes(ultima) ? ultima : validas[0];
  navegar(destino);
}

function cambiarRol(idRol) {
  if (!ROLES[idRol]) return;
  ESTADO.rolActivo = idRol;
  const inicial = ROLES[idRol].inicial;
  ESTADO.vistaActiva = inicial;
  ESTADO.grupoExpandido = VISTAS[inicial].grupo;
  renderTodo();
}

function cambiarTema(idTema) {
  if (!TEMAS.find(t => t.id === idTema)) return;
  ESTADO.temaActivo = idTema;
  try { localStorage.setItem('latocata:tema', idTema); } catch (_) {}
  renderTodo();
}

/* ================================================================
   ACCIONES
   ================================================================ */
function moverActo(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= ESTADO.acts.length) return;
  const tmp = ESTADO.acts[idx];
  ESTADO.acts[idx] = ESTADO.acts[j];
  ESTADO.acts[j] = tmp;
  ESTADO.acts.forEach((a, i) => a.orden = i + 1);
  renderTodo();
}

function accionActo(idx, accion) {
  const a = ESTADO.acts[idx];
  if (!a) return;
  switch (accion) {
    case 'aprobar': a.estado = 'aprobado'; break;
    case 'iniciar': {
      const l = actoEnVivo();
      if (l) l.estado = 'terminado';
      a.estado = 'en_curso';
      ESTADO.seg = 0;
      break;
    }
    case 'terminar': a.estado = 'terminado'; break;
    case 'saltar': a.estado = 'saltado'; break;
    case 'ext5': a.min += 5; break;
    case 'ext10': a.min += 10; break;
  }
  renderTodo();
}

function mostrarToast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:80px;right:16px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r);border:var(--bw) solid var(--a1);box-shadow:var(--sh);z-index:60;font-size:.85rem;font-weight:700;';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

/* ================================================================
   LISTENERS
   ================================================================ */
document.addEventListener('click', (ev) => {
  const toggleGrupo = ev.target.closest('[data-toggle-grupo]');
  if (toggleGrupo) { togglearGrupo(toggleGrupo.dataset.toggleGrupo); return; }

  const nav = ev.target.closest('[data-navegar]');
  if (nav) { navegar(nav.dataset.navegar); return; }

  const tabGrupo = ev.target.closest('[data-tab-grupo]');
  if (tabGrupo) { irATabDeGrupo(tabGrupo.dataset.tabGrupo); return; }

  const rol = ev.target.closest('[data-cambiar-rol]');
  if (rol) { cambiarRol(rol.dataset.cambiarRol); return; }

  const tema = ev.target.closest('[data-cambiar-tema]');
  if (tema) { cambiarTema(tema.dataset.cambiarTema); return; }

  const chk = ev.target.closest('[data-toggle-chk]');
  if (chk) {
    const i = +chk.dataset.toggleChk;
    ESTADO.chk[i].hecho = !ESTADO.chk[i].hecho;
    renderContenido();
    return;
  }

  const mover = ev.target.closest('[data-mover]');
  if (mover) {
    const [i, d] = mover.dataset.mover.split(':').map(Number);
    moverActo(i, d);
    return;
  }

  const accion = ev.target.closest('[data-acto]');
  if (accion) {
    const [i, a] = accion.dataset.acto.split(':');
    accionActo(+i, a);
    return;
  }

  const prestamo = ev.target.closest('[data-prestamo]');
  if (prestamo) {
    const i = +prestamo.dataset.prestamo;
    ESTADO.equipo[i].prestadoA = ESTADO.equipo[i].prestadoA ? '' : 'Andrés';
    renderContenido();
    return;
  }

  const caja = ev.target.closest('[data-caja]');
  if (caja) {
    const sig = +caja.dataset.caja;
    const c = document.getElementById('caja-concepto').value.trim() || 'Movimiento';
    const m = +document.getElementById('caja-monto').value;
    if (m) {
      ESTADO.caja.push({ concepto: c, monto: m * sig });
      renderContenido();
    }
    return;
  }

  const acc = ev.target.closest('[data-accion]');
  if (acc) {
    const a = acc.dataset.accion;
    if (a === 'aviso') { mostrarToast('Aviso publicado en la cartelera.'); return; }
    if (a === 'cerrar') { mostrarToast('Jornada cerrada. Resumen generado.'); return; }
    if (a === 'guardar-notas') { mostrarToast('Notas guardadas.'); return; }
    if (a.startsWith('aforo:')) {
      const d = +a.split(':')[1];
      ESTADO.aforo = Math.max(0, Math.min(120, ESTADO.aforo + d));
      renderContenido();
      return;
    }
  }
});

document.getElementById('btn-replegar').addEventListener('click', () => {
  ESTADO.replegado = !ESTADO.replegado;
  document.getElementById('shell').classList.toggle('replegado', ESTADO.replegado);
});

document.getElementById('btn-hamburguesa').addEventListener('click', () => {
  document.getElementById('lateral').classList.toggle('abierto');
  document.getElementById('overlay').classList.toggle('activo');
});

document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('lateral').classList.remove('abierto');
  document.getElementById('overlay').classList.remove('activo');
});

/* ================================================================
   CRONÓMETRO
   ================================================================ */
setInterval(() => {
  ESTADO.seg++;
  const c1 = document.getElementById('crono-esc');
  const c2 = document.getElementById('crono-cola');
  if (c1) c1.textContent = tiempoCrono();
  if (c2) c2.textContent = tiempoCrono();
}, 1000);

/* ================================================================
   INICIO
   ================================================================ */
try {
  const t = localStorage.getItem('latocata:tema');
  if (t && TEMAS.find(x => x.id === t)) ESTADO.temaActivo = t;
} catch (_) {}

renderTodo();
</script>
</body>
</html>
