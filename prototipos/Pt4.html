<!DOCTYPE html>
<html lang="es-CL" data-tema="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaTocata — Prototipo 6 · Tema original + acordeón de rol</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,600;0,700;1,500;1,600&family=Figtree:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   BASE
   ================================================================ */
:root { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Figtree', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100dvh;
  font-size: 15px;
  line-height: 1.4;
  transition: background 0.25s ease, color 0.25s ease;
}
h1, h2, h3, h4 { font-weight: 700; line-height: 1.1; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font: inherit; color: inherit; }
a { color: var(--a1); text-decoration: none; }
ul, ol { list-style: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--ch); border-radius: 4px; }

/* ================================================================
   TEMAS
   ================================================================ */
body[data-tema="a"] {
  --bg:#f1e7d0; --pa:#fbf4e2; --ink:#1d1a16;
  --a1:#d6402a; --a2:#2a4d9b; --on1:#fff; --on2:#fff;
  --ch:#e3d5b4; --fd:'Anton',Impact,sans-serif;
  --r:4px; --bw:2px; --sh:4px 4px 0 var(--ink);
  --tt:uppercase; --ti:normal;
}
body[data-tema="c"] {
  --bg:#f0e0b4; --pa:#fff6dc; --ink:#2b1a0d;
  --a1:#c0392b; --a2:#1f6b4a; --on1:#fff6dc; --on2:#fff6dc;
  --ch:#e6cf93; --fd:'Fraunces',serif;
  --r:16px; --bw:3px; --sh:0 4px 0 var(--ink);
  --tt:none; --ti:italic;
}
body[data-tema="b"] {
  --bg:#0c0a14; --pa:#171227; --ink:#f1ecff;
  --a1:#ff4fa3; --a2:#7b4dff; --on1:#fff; --on2:#fff;
  --ch:#2a2147; --fd:'Space Grotesk',sans-serif;
  --r:18px; --bw:1px; --sh:0 0 18px rgba(255,79,163,.4);
  --tt:none; --ti:normal;
}
body[data-tema="d"] {
  --bg:#cdb48a; --pa:#e6d4ae; --ink:#231b12;
  --a1:#1f4d3a; --a2:#f2b705; --on1:#f2e8d0; --on2:#231b12;
  --ch:#bfa271; --fd:'Anton',Impact,sans-serif;
  --r:2px; --bw:2px; --sh:3px 3px 0 var(--ink);
  --tt:uppercase; --ti:normal;
}
body[data-tema="e"] {
  --bg:#ffe3ec; --pa:#fff; --ink:#2a1f4d;
  --a1:#ff5c8a; --a2:#19b5a5; --on1:#fff; --on2:#fff;
  --ch:#ffd0de; --fd:'Fraunces',serif;
  --r:22px; --bw:2px; --sh:4px 4px 0 #2a1f4d;
  --tt:none; --ti:normal;
}
/* Tema F — Original (el anterior a los prototipos) */
body[data-tema="f"] {
  --bg:#f5eee3; --pa:#ffffff; --ink:#2a2118;
  --a1:#a85530; --a2:#4a5c37; --on1:#fff; --on2:#fff;
  --ch:#ebe0cd; --fd:'Fraunces',serif;
  --r:10px; --bw:1px; --sh:0 2px 8px rgba(60,40,20,0.08);
  --tt:none; --ti:normal;
}

/* ================================================================
   SHELL
   ================================================================ */
.shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: 100dvh;
  transition: grid-template-columns 0.28s ease;
}
.shell.replegado { grid-template-columns: 72px 1fr; }

.shell__lateral {
  background: var(--pa);
  border-right: var(--bw) solid var(--ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.shell__marca {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 20px;
  border-bottom: var(--bw) solid var(--ink);
  min-height: 64px;
  flex-shrink: 0;
}
.shell__marca-logo {
  width: 34px; height: 34px;
  border-radius: var(--r);
  background: var(--a1);
  color: var(--on1);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fd);
  font-weight: 700;
  font-size: 0.95rem;
  border: var(--bw) solid var(--ink);
  text-transform: var(--tt);
  font-style: var(--ti);
  flex-shrink: 0;
}
.shell__marca-texto {
  font-family: var(--fd);
  font-size: 1.1rem;
  text-transform: var(--tt);
  font-style: var(--ti);
  color: var(--a1);
  white-space: nowrap;
  transition: opacity 0.2s;
}
.shell.replegado .shell__marca-texto { opacity: 0; width: 0; overflow: hidden; }

/* ================================================================
   SELECTOR DE ROL — ACORDEÓN
   ================================================================ */
.selector-rol-lateral {
  border-bottom: var(--bw) solid var(--ink);
  flex-shrink: 0;
}
.selector-rol-lateral__cabecera {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  transition: background 0.15s;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  color: inherit;
  font: inherit;
}
.selector-rol-lateral__cabecera:hover { background: var(--ch); }

.selector-rol-lateral__cabecera-icono {
  width: 26px; height: 26px;
  border-radius: var(--r);
  background: var(--a1);
  color: var(--on1);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem;
  flex-shrink: 0;
  border: var(--bw) solid var(--ink);
}
.selector-rol-lateral__cabecera-info {
  flex: 1;
  min-width: 0;
  transition: opacity 0.2s;
}
.shell.replegado .selector-rol-lateral__cabecera-info { opacity: 0; width: 0; overflow: hidden; }

.selector-rol-lateral__cabecera-eyebrow {
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  opacity: 0.55;
}
.selector-rol-lateral__cabecera-nombre {
  font-family: var(--fd);
  font-size: 0.9rem;
  text-transform: var(--tt);
  font-style: var(--ti);
  color: var(--a1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}
.selector-rol-lateral__cabecera-flecha {
  font-size: 0.7rem;
  transition: transform 0.25s ease;
  flex-shrink: 0;
  opacity: 0.6;
}
.shell.replegado .selector-rol-lateral__cabecera-flecha { opacity: 0; }
.selector-rol-lateral.expandido .selector-rol-lateral__cabecera-flecha { transform: rotate(90deg); }

/* Lista desplegable con transición por grid-template-rows */
.selector-rol-lateral__lista {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.25s ease;
}
.selector-rol-lateral.expandido .selector-rol-lateral__lista {
  grid-template-rows: 1fr;
}
.selector-rol-lateral__lista-inner {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 8px 8px;
}
.selector-rol-lateral__item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r);
  color: var(--ink);
  font-size: 0.82rem;
  font-weight: 700;
  text-align: left;
  transition: background 0.15s;
  border: var(--bw) solid transparent;
  width: 100%;
}
.selector-rol-lateral__item:hover { background: var(--ch); }
.selector-rol-lateral__item.activo {
  background: var(--a1);
  color: var(--on1);
  border-color: var(--ink);
}
.selector-rol-lateral__icono {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}
.selector-rol-lateral__label {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.2s;
}
.shell.replegado .selector-rol-lateral__label { opacity: 0; }

/* Replegado: el acordeón no aplica */
.shell.replegado .selector-rol-lateral__lista { grid-template-rows: 0fr !important; }
.shell.replegado .selector-rol-lateral__cabecera { justify-content: center; padding: 12px 8px; }

.shell__lateral-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.shell__grupo-titulo {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-weight: 700;
  opacity: 0.5;
  padding: 12px 20px 4px;
  white-space: nowrap;
  transition: opacity 0.2s;
}
.shell.replegado .shell__grupo-titulo { opacity: 0; }

.shell__item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 20px;
  color: var(--ink);
  font-size: 0.88rem;
  font-weight: 600;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
  cursor: pointer;
  width: 100%;
  text-align: left;
}
.shell__item:hover { background: var(--ch); }
.shell__item.activo {
  background: var(--ch);
  border-left-color: var(--a1);
  color: var(--a1);
}
.shell__item-icono {
  width: 20px; height: 20px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem;
}
.shell__item-label { transition: opacity 0.2s; flex: 1; min-width: 0; }
.shell.replegado .shell__item-label { opacity: 0; width: 0; overflow: hidden; }

.shell__lateral-pie {
  border-top: var(--bw) solid var(--ink);
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  font-size: 0.78rem;
}
.shell__usuario-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--a2);
  color: var(--on2);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 0.75rem;
  flex-shrink: 0;
  border: var(--bw) solid var(--ink);
}
.shell__usuario-info { transition: opacity 0.2s; min-width: 0; }
.shell__usuario-nombre { font-weight: 700; white-space: nowrap; }
.shell__usuario-sub { opacity: 0.6; font-size: 0.7rem; white-space: nowrap; }
.shell.replegado .shell__usuario-info { opacity: 0; width: 0; overflow: hidden; }

.shell__btn-replegar {
  position: absolute;
  top: 16px;
  right: -18px;
  width: 36px; height: 36px;
  border-radius: var(--r);
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30;
  box-shadow: var(--sh);
}

.shell__principal {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
  overflow: hidden;
}

.shell__topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: var(--bw) solid var(--ink);
  background: var(--pa);
  min-height: 64px;
  flex-shrink: 0;
}
.shell__btn-hamburguesa {
  display: none;
  width: 40px; height: 40px;
  border-radius: var(--r);
  border: var(--bw) solid var(--ink);
  background: var(--pa);
  color: var(--ink);
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.shell__topbar-titulo-zona { flex: 1; min-width: 0; }
.shell__eyebrow {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  color: var(--a1);
  opacity: 0.85;
}
.shell__titulo {
  font-family: var(--fd);
  font-size: 1.25rem;
  font-weight: 700;
  text-transform: var(--tt);
  font-style: var(--ti);
  color: var(--a1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.05;
}

.shell__selector-tema {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.shell__tema-btn {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  transition: transform 0.15s;
}
.shell__tema-btn:hover { transform: scale(1.1); }
.shell__tema-btn.activo { outline: 2px solid var(--a1); outline-offset: 2px; }
.shell__tema-btn[data-tema-btn="a"] { background: linear-gradient(135deg, #d6402a 50%, #f1e7d0 50%); }
.shell__tema-btn[data-tema-btn="c"] { background: linear-gradient(135deg, #c0392b 50%, #f0e0b4 50%); }
.shell__tema-btn[data-tema-btn="b"] { background: linear-gradient(135deg, #ff4fa3 50%, #0c0a14 50%); }
.shell__tema-btn[data-tema-btn="d"] { background: linear-gradient(135deg, #1f4d3a 50%, #cdb48a 50%); }
.shell__tema-btn[data-tema-btn="e"] { background: linear-gradient(135deg, #ff5c8a 50%, #ffe3ec 50%); }
.shell__tema-btn[data-tema-btn="f"] { background: linear-gradient(135deg, #a85530 50%, #f5eee3 50%); }

.shell__chips {
  display: flex;
  gap: 6px;
  padding: 10px 20px;
  background: var(--bg);
  border-bottom: var(--bw) solid var(--ink);
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}
.shell__chips::-webkit-scrollbar { display: none; }
.shell__chip {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink);
  background: var(--pa);
  border: var(--bw) solid transparent;
  white-space: nowrap;
  transition: all 0.15s;
}
.shell__chip:hover { border-color: var(--ink); }
.shell__chip.activo {
  background: var(--a1);
  color: var(--on1);
  border-color: var(--ink);
}

.shell__contenido {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  padding-bottom: 100px;
}

.shell__tabbar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--pa);
  border-top: var(--bw) solid var(--ink);
  padding: 6px 8px;
  justify-content: space-around;
  z-index: 20;
  padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  overflow-x: auto;
  scrollbar-width: none;
}
.shell__tabbar::-webkit-scrollbar { display: none; }
.shell__tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 8px;
  border-radius: var(--r);
  color: var(--ink);
  opacity: 0.6;
  font-size: 0.6rem;
  font-weight: 700;
  transition: opacity 0.15s;
  min-width: 52px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.shell__tab.activo { opacity: 1; color: var(--a1); }
.shell__tab-icono { font-size: 1.25rem; }

.shell__overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 35;
}
.shell__overlay.activo { display: block; }

/* ================================================================
   COMPONENTES
   ================================================================ */
.hero {
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  padding: 24px;
  box-shadow: var(--sh);
  position: relative;
  overflow: hidden;
}
.hero__badges { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.hero__titulo {
  font-family: var(--fd);
  font-size: clamp(2rem, 6vw, 3.2rem);
  text-transform: var(--tt);
  font-style: var(--ti);
  color: var(--a1);
  line-height: 0.95;
  margin: 8px 0 10px;
  letter-spacing: -0.01em;
}
.hero__desc { font-size: 0.98rem; margin-bottom: 16px; max-width: 640px; line-height: 1.5; }
.hero__meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.88rem; font-weight: 500; }

.sub { opacity: 0.68; font-size: 0.85rem; margin-bottom: 14px; line-height: 1.5; }
h3 {
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--a1);
  margin: 20px 0 8px;
  font-weight: 700;
}
h3:first-child { margin-top: 0; }

.g { display: grid; gap: 10px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.g--2fijo { grid-template-columns: repeat(2, 1fr); }

.card {
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: var(--sh);
}
.card__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.card__titulo {
  font-family: var(--fd);
  font-size: 1.05rem;
  text-transform: var(--tt);
  font-style: var(--ti);
  color: var(--ink);
}

.k { font: 2rem/1 var(--fd); color: var(--a1); }
.l {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  opacity: 0.65;
  font-weight: 700;
  margin-top: 2px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--a1);
  color: var(--on1);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  font-size: 0.85rem;
  font-weight: 700;
  box-shadow: var(--sh);
  transition: transform 0.1s, box-shadow 0.1s;
  white-space: nowrap;
}
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn--secundario { background: var(--pa); color: var(--ink); box-shadow: none; }
.btn--fantasma { background: transparent; color: var(--ink); border-color: transparent; box-shadow: none; }
.btn--fantasma:hover { border-color: var(--ink); }
.btn--peligro { background: var(--pa); color: var(--a1); border-color: var(--a1); box-shadow: none; }
.btn--chico { padding: 5px 10px; font-size: 0.76rem; }
.btn--grande { padding: 12px 22px; font-size: 0.95rem; }
.btn--bloque { width: 100%; }

.pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--ch);
  color: var(--ink);
  font-size: 0.7rem;
  font-weight: 700;
  border: var(--bw) solid var(--ink);
  margin: 2px 2px 0 0;
}
.pill--ok { background: var(--a2); color: var(--on2); }
.pill--hot { background: var(--a1); color: var(--on1); }
.pill--vivo::before {
  content: '●';
  margin-right: 4px;
  animation: pulso 1.4s ease infinite;
}
@keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--pa);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  margin-bottom: 8px;
  box-shadow: var(--sh);
}
.row:last-child { margin-bottom: 0; }
.row__num {
  font-family: var(--fd);
  font-size: 1.2rem;
  width: 32px;
  text-align: center;
  color: var(--a1);
  flex-shrink: 0;
}
.row__info { flex: 1; min-width: 0; }
.row__titulo { font-weight: 700; font-size: 0.95rem; }
.row__meta { font-size: 0.76rem; opacity: 0.7; margin-top: 1px; }
.row--vivo { background: var(--a2); color: var(--on2); border-color: var(--ink); }
.row--vivo .row__num { color: var(--on2); }
.row--terminado { opacity: 0.5; }
.row--saltado { opacity: 0.4; text-decoration: line-through; }

.crono {
  font-family: var(--fd);
  font-size: clamp(3rem, 16vw, 6rem);
  color: var(--a1);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.barra {
  height: 10px;
  border: var(--bw) solid var(--ink);
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0;
  background: var(--pa);
}
.barra b {
  display: block;
  height: 100%;
  background: var(--a2);
  transition: width 0.3s;
}
.barra b.alerta { background: var(--a1); }

.chk {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px dashed var(--ch);
  cursor: pointer;
}
.chk:last-child { border-bottom: none; }
.chk i {
  width: 22px; height: 22px;
  border: var(--bw) solid var(--ink);
  border-radius: calc(var(--r) / 2);
  display: grid;
  place-items: center;
  font-style: normal;
  font-size: 0.8rem;
  flex-shrink: 0;
}
.chk.d i { background: var(--a2); color: var(--on2); }
.chk.d span { text-decoration: line-through; opacity: 0.55; }

  chk: JSON.parse(JSON.stringify(LISTA_DIA)),
  turnos: JSON.parse(JSON.stringify(TURNOS)),
  caja: JSON.parse(JSON.stringify(CAJA)),
  equipo: JSON.parse(JSON.stringify(EQUIPO))
};

function pad(n) { return String(n).padStart(2, '0'); }
function tiempoCrono() { return pad(Math.floor(ESTADO.seg / 60)) + ':' + pad(ESTADO.seg % 60); }
function saldoCaja() { return ESTADO.caja.reduce((s, c) => s + c.monto, 0); }
function actoEnVivo() { return ESTADO.acts.find(a => a.estado === 'en_curso'); }
function casaActual() { return CASAS_POR_ROL[ESTADO.rolActivo]; }

function seccionDeVista(idVista) {
  const casa = casaActual();
  for (const sec of casa.secciones) {
    if (sec.vistas.includes(idVista)) return sec.titulo;
  }
  return '';
}

function rolesDisponibles() {
  return USUARIO_PRUEBA.roles.filter(r => CASAS_POR_ROL[r]);
}

/* ================================================================
   SELECTOR DE ROL — acordeón
   ================================================================ */
function renderSelectorRolLateral() {
  const cont = document.getElementById('selector-rol-lateral');
  const roles = rolesDisponibles();

  if (roles.length <= 1) {
    cont.innerHTML = '';
    cont.style.display = 'none';
    return;
  }
  cont.style.display = 'block';
  cont.classList.toggle('expandido', ESTADO.selectorRolExpandido);

  const casaActiva = casaActual();
  const rolActivoNombre = ROLES_NOMBRES[ESTADO.rolActivo];

  cont.innerHTML = `
    <button class="selector-rol-lateral__cabecera" data-toggle-selector-rol="1">
      <span class="selector-rol-lateral__cabecera-icono">${casaActiva.icono}</span>
      <span class="selector-rol-lateral__cabecera-info">
        <span class="selector-rol-lateral__cabecera-eyebrow">Estás como</span>
        <span class="selector-rol-lateral__cabecera-nombre">${rolActivoNombre}</span>
      </span>
      <span class="selector-rol-lateral__cabecera-flecha">▸</span>
    </button>
    <div class="selector-rol-lateral__lista">
      <div class="selector-rol-lateral__lista-inner">
        ${roles.map(idRol => {
          const casa = CASAS_POR_ROL[idRol];
          const activo = idRol === ESTADO.rolActivo;
          return `
            <button class="selector-rol-lateral__item ${activo ? 'activo' : ''}" data-cambiar-rol="${idRol}">
              <span class="selector-rol-lateral__icono">${casa.icono}</span>
              <span class="selector-rol-lateral__label">${ROLES_NOMBRES[idRol]}</span>
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function togglearSelectorRol() {
  ESTADO.selectorRolExpandido = !ESTADO.selectorRolExpandido;
  const cont = document.getElementById('selector-rol-lateral');
  cont.classList.toggle('expandido', ESTADO.selectorRolExpandido);
}

function renderSidebar() {
  const casa = casaActual();

  nav.innerHTML = casa.secciones.map(sec => `
    <div class="shell__grupo-titulo">${sec.titulo}</div>

      const activa = idVista === ESTADO.vistaActiva;
      return `<button class="shell__item ${activa ? 'activo' : ''}" data-navegar="${idVista}">
        <span class="shell__item-icono">${v.icono}</span>

function renderTopbar() {
  const v = VISTAS[ESTADO.vistaActiva] || { titulo: '—' };

function renderChips() {
  const chipsEl = document.getElementById('chips');
  const seccionActual = seccionDeVista(ESTADO.vistaActiva);
  const casa = casaActual();
  const seccion = casa.secciones.find(s => s.titulo === seccionActual);

  if (!seccion || seccion.vistas.length <= 1) {
    chipsEl.style.display = 'none';
    return;

  chipsEl.style.display = 'flex';

  chipsEl.innerHTML = seccion.vistas.map(idVista => {

    return `<button class="shell__chip ${activa ? 'activo' : ''}" data-navegar="${idVista}">${v.titulo}</button>`;
  }).join('');

function filaActo(a, i, conControles) {
  const claseEstado = a.estado === 'en_curso' ? 'row--vivo'
    : a.estado === 'terminado' ? 'row--terminado'
    : a.estado === 'saltado' ? 'row--saltado' : '';

  let pildora = '';
  if (a.estado === 'en_curso') pildora = '<span class="pill pill--ok pill--vivo">En vivo</span>';
  else if (a.estado === 'aprobado') pildora = '<span class="pill pill--hot">Aprobado</span>';
  else if (a.estado === 'anotado') pildora = '<span class="pill">Anotado</span>';
  else if (a.estado === 'terminado') pildora = '<span class="pill">Terminado</span>';
  else if (a.estado === 'saltado') pildora = '<span class="pill">Saltado</span>';

  let controles = '';
  if (conControles) {
    controles += `<button class="btn btn--fantasma btn--chico" data-mover="${i}:-1">▲</button>
                  <button class="btn btn--fantasma btn--chico" data-mover="${i}:1">▼</button>`;
    if (a.estado === 'anotado') controles += `<button class="btn btn--chico" data-acto="${i}:aprobar">Aprobar</button>`;
    if (a.estado === 'aprobado') controles += `<button class="btn btn--chico" data-acto="${i}:iniciar">▶</button><button class="btn btn--secundario btn--chico" data-acto="${i}:saltar">Saltar</button>`;
    if (a.estado === 'en_curso') controles += `<button class="btn btn--chico" data-acto="${i}:terminar">✓ Fin</button>`;
  }

  const hastaBadge = a.hastaQueLoBajen ? '<span class="pill pill--hot" style="margin-top:6px">Hasta que lo bajen</span>' : '';

  return `
    <div class="row ${claseEstado}">
      <div class="row__num">${a.orden}</div>
      <div class="row__info">
        <div class="row__titulo">${a.nombre}</div>
        <div class="row__meta">${a.tipo} · ${a.genero} · ${a.instrumentos.join(', ')} · ~${a.min} min</div>
        ${hastaBadge}
      </div>
      ${pildora}
      ${controles ? `<div style="display:flex;gap:4px;flex-wrap:wrap;">${controles}</div>` : ''}
    </div>
  `;
}

        <span class="qa__icono" style="background:linear-gradient(135deg, var(--a1), var(--a2));">🎨</span>
        <span class="qa__texto">
          <span class="qa__titulo">${t.nombre}</span>
          <span class="qa__desc">${t.id === ESTADO.temaActivo ? 'Activo' : 'Toque para aplicar'}</span>
        </span>
        ${t.id === ESTADO.temaActivo ? '<span class="qa__flecha">✓</span>' : '<span class="qa__flecha">→</span>'}
      </button>
    `).join('')}
  </div>

  <h3>Roles</h3>
  <div class="card">
    <p style="margin-bottom:8px;"><b>Owner</b> · <b>Organizador</b> · <b>Staff</b> · <b>Músico</b> · <b>Anfitrión</b> · <b>Público</b>.</p>
    <p class="sub" style="margin-bottom:0;">El owner asigna los roles dentro del grupo. La cuenta es global de Elisekai, el rol es específico de LaTocata.</p>
  </div>
`;

function renderContenido() {
  const cont = document.getElementById('contenido');
  const fn = RENDER[ESTADO.vistaActiva];
  if (!fn) {
    cont.innerHTML = '<div class="card">Vista no implementada.</div>';
    return;
  }
  const casa = casaActual();
  const esInicialDelRol = ESTADO.vistaActiva === casa.inicial;
  cont.innerHTML = (esInicialDelRol ? renderHomeRol() : '') + fn();
}

function renderTodo() {
  document.body.setAttribute('data-tema', ESTADO.temaActivo);
  renderSelectorRolLateral();
  renderSidebar();
  renderTopbar();
  renderChips();
  renderContenido();
  renderTabbar();
}

function navegar(idVista) {
  if (!VISTAS[idVista]) return;
  ESTADO.vistaActiva = idVista;
  renderTodo();
  document.getElementById('lateral').classList.remove('abierto');
  document.getElementById('overlay').classList.remove('activo');
}

function cambiarRol(idRol) {
  if (!CASAS_POR_ROL[idRol]) return;
  ESTADO.rolActivo = idRol;
  ESTADO.vistaActiva = CASAS_POR_ROL[idRol].inicial;
  ESTADO.selectorRolExpandido = false;
  renderTodo();
}

function cambiarTema(idTema) {
  if (!TEMAS.find(t => t.id === idTema)) return;
  ESTADO.temaActivo = idTema;
  try { localStorage.setItem('latocata:tema', idTema); } catch (_) {}
  renderTodo();
}

function moverActo(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= ESTADO.acts.length) return;
  const tmp = ESTADO.acts[idx];
  ESTADO.acts[idx] = ESTADO.acts[j];
  ESTADO.acts[j] = tmp;
  ESTADO.acts.forEach((a, i) => a.orden = i + 1);
  renderTodo();
}

function accionActo(idx, accion) {
  const a = ESTADO.acts[idx];
  if (!a) return;
  switch (accion) {
    case 'aprobar': a.estado = 'aprobado'; break;
    case 'iniciar': {
      const l = actoEnVivo();
      if (l) l.estado = 'terminado';
      a.estado = 'en_curso';
      ESTADO.seg = 0;
      break;
    }
    case 'terminar': a.estado = 'terminado'; break;
    case 'saltar': a.estado = 'saltado'; break;
    case 'ext5': a.min += 5; break;
    case 'ext10': a.min += 10; break;
  }
  renderTodo();
}

function mostrarToast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:80px;right:16px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r);border:var(--bw) solid var(--a1);box-shadow:var(--sh);z-index:60;font-size:.85rem;font-weight:700;';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

document.addEventListener('click', (ev) => {
  // Acordeón del selector de rol
  const toggleRol = ev.target.closest('[data-toggle-selector-rol]');
  if (toggleRol) { togglearSelectorRol(); return; }

  const nav = ev.target.closest('[data-navegar]');
  if (nav) { navegar(nav.dataset.navegar); return; }

  const rol = ev.target.closest('[data-cambiar-rol]');
  if (rol) { cambiarRol(rol.dataset.cambiarRol); return; }

  const tema = ev.target.closest('[data-cambiar-tema]');
  if (tema) { cambiarTema(tema.dataset.cambiarTema); return; }

  const tabSec = ev.target.closest('[data-tab-seccion]');
  if (tabSec) { navegar(tabSec.dataset.tabSeccion); return; }

  const chk = ev.target.closest('[data-toggle-chk]');
  if (chk) {
    const i = +chk.dataset.toggleChk;
    ESTADO.chk[i].hecho = !ESTADO.chk[i].hecho;
    renderContenido();
    return;
  }

  const turno = ev.target.closest('[data-turno]');
  if (turno) {
    const i = +turno.dataset.turno;
    ESTADO.turnos[i].hecho = !ESTADO.turnos[i].hecho;
    renderContenido();
    return;
  }

  const mover = ev.target.closest('[data-mover]');
  if (mover) {
    const [i, d] = mover.dataset.mover.split(':').map(Number);
    moverActo(i, d);
    return;
  }

  const accion = ev.target.closest('[data-acto]');
  if (accion) {
    const [i, a] = accion.dataset.acto.split(':');
    accionActo(+i, a);
    return;
  }

  const prestamo = ev.target.closest('[data-prestamo]');
  if (prestamo) {
    const i = +prestamo.dataset.prestamo;
    ESTADO.equipo[i].prestadoA = ESTADO.equipo[i].prestadoA ? '' : 'Andrés';
    renderContenido();
    return;
  }

  const caja = ev.target.closest('[data-caja]');
  if (caja) {
    const sig = +caja.dataset.caja;
    const c = document.getElementById('caja-concepto').value.trim() || 'Movimiento';
    const m = +document.getElementById('caja-monto').value;
    if (m) {
      ESTADO.caja.push({ concepto: c, monto: m * sig });
      renderContenido();
    }
    return;
  }

  const presencia = ev.target.closest('[data-toggle-presencia]');
  if (presencia) {
    ESTADO.presente = !ESTADO.presente;
    renderContenido();
    return;
  }

  const votar = ev.target.closest('[data-votar]');
  if (votar) {
    mostrarToast('Voto emitido. ¡Gracias!');
    return;
  }

  const acc = ev.target.closest('[data-accion]');
  if (acc) {
    const a = acc.dataset.accion;
    if (a === 'aviso') { mostrarToast('Aviso publicado en la cartelera.'); return; }
    if (a === 'cerrar') { mostrarToast('Jornada cerrada. Resumen generado.'); return; }
    if (a === 'guardar-notas') { mostrarToast('Notas guardadas.'); return; }
    if (a === 'enviar-aviso-equipo') { mostrarToast('Aviso enviado al equipo.'); return; }
    if (a.startsWith('aforo:')) {
      const d = +a.split(':')[1];
      ESTADO.aforo = Math.max(0, Math.min(80, ESTADO.aforo + d));
      renderContenido();
      return;
    }
  }
});

document.getElementById('btn-replegar').addEventListener('click', () => {
  ESTADO.replegado = !ESTADO.replegado;
  document.getElementById('shell').classList.toggle('replegado', ESTADO.replegado);
});

document.getElementById('btn-hamburguesa').addEventListener('click', () => {
  document.getElementById('lateral').classList.toggle('abierto');
  document.getElementById('overlay').classList.toggle('activo');
});

document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('lateral').classList.remove('abierto');
  document.getElementById('overlay').classList.remove('activo');
});

setInterval(() => {
  ESTADO.seg++;
  const ids = ['crono-esc', 'crono-cola', 'crono-cartelera'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = tiempoCrono();
  });
}, 1000);

try {
  const t = localStorage.getItem('latocata:tema');
  if (t && TEMAS.find(x => x.id === t)) ESTADO.temaActivo = t;
} catch (_) {}

renderTodo();
</script>
</body>
</html>
